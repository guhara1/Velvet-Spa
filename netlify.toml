# ─────────────────────────────────────────────────────────────
#  Netlify 배포 설정
#  - 빌드: npm run build  →  dist/ 를 그대로 서빙 (의존성 0개)
#  - 도메인/상호 확정 전이므로 canonical 은 Netlify 가 주는 URL 을 사용
# ─────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 커스텀 도메인 연결 후 아래를 Netlify UI(Site settings → Environment variables)에
  # SITE_URL = "https://example.com" 로 등록하면 canonical/sitemap 이 전부 교체됩니다.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/서울/*"
  to = "/seoul/:splat"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
